name: Build RustDesk Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build/**"
      - "container/**"
      - "charts/**"
      - ".context/**"
      - "AGENTS.md"
      - ".github/workflows/build-web.yml"
      - "README.md"
  pull_request:
    paths:
      - "build/**"
      - "container/**"
      - "charts/**"
      - ".context/**"
      - "AGENTS.md"
      - ".github/workflows/build-web.yml"
      - "README.md"

permissions:
  contents: read
  packages: write

concurrency:
  group: rustdesk-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1

      - name: Validate Helm chart
        shell: bash
        run: |
          set -euo pipefail
          helm lint charts/rustdesk-stack
          helm template rustdesk charts/rustdesk-stack >/dev/null
          helm template rustdesk charts/rustdesk-stack \
            --set gateway.enabled=true \
            --set gateway.gatewayName=public \
            --set gateway.hostname=rustdesk.example.com >/dev/null

      - name: Load pinned baseline versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source build/baseline.env
          set +a
          echo "packaging_ref=${PACKAGING_REF}" >> "$GITHUB_OUTPUT"
          echo "web_client_ref=${WEB_CLIENT_REF}" >> "$GITHUB_OUTPUT"
          echo "flutter_version=${FLUTTER_VERSION}" >> "$GITHUB_OUTPUT"
          echo "rust_version=${RUST_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build pinned baseline image
        shell: bash
        env:
          IMAGE_TAG: rustdesk-web-stack:ci
        run: bash build/build-baseline-image.sh

      - name: Verify web artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/web/index.html
          test -s dist/web/main.dart.js || test -s dist/web/flutter_bootstrap.js
          test -s dist/web/BUILD-INFO.txt
          grep -q '^Runtime: Caddy$' dist/web/BUILD-INFO.txt
          test -d dist/web/js

      - name: Upload web artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-web-${{ steps.versions.outputs.web_client_ref }}
          path: dist/web/
          if-no-files-found: error
          retention-days: 14

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish baseline web snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          short_ref="${{ steps.versions.outputs.web_client_ref }}"
          short_ref="${short_ref:0:12}"
          base='ghcr.io/nomed/rustdesk-web-stack/web'
          docker tag rustdesk-web-stack:ci "${base}:edge"
          docker tag rustdesk-web-stack:ci "${base}:web-${short_ref}"
          docker push "${base}:edge"
          docker push "${base}:web-${short_ref}"
