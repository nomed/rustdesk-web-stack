name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-22.04
    outputs:
      release_created: ${{ steps.state.outputs.release_created }}
      version: ${{ steps.state.outputs.version }}
      tag_name: ${{ steps.state.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Ensure merged release is published
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail

          created="${RELEASE_CREATED:-false}"
          version="${RELEASE_VERSION:-}"
          tag="${RELEASE_TAG:-}"

          if [[ -z "${version}" ]]; then
            version="$(python3 - <<'PY'
          import json
          with open('.release-please-manifest.json', encoding='utf-8') as f:
              print(json.load(f)['.'])
          PY
          )"
          fi

          if [[ -z "${tag}" ]]; then
            tag="v${version}"
          fi

          if [[ "${created}" != "true" && "${version}" != "0.0.0" ]]; then
            if gh release view "${tag}" >/dev/null 2>&1; then
              echo "Release ${tag} already exists"
            else
              release_sha="$(git log -1 --format=%H -- .release-please-manifest.json)"
              echo "Creating missing release ${tag} at ${release_sha}"
              gh release create "${tag}" \
                --target "${release_sha}" \
                --title "${tag}" \
                --generate-notes
              created=true
            fi
          fi

          echo "release_created=${created}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag}" >> "$GITHUB_OUTPUT"

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Log in to GHCR for Docker
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release image
        shell: bash
        env:
          IMAGE_TAG: ghcr.io/nomed/rustdesk-web-stack:${{ needs.release-please.outputs.version }}
        run: bash build/build-baseline-image.sh

      - name: Publish release image
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.release-please.outputs.version }}'
          docker push "ghcr.io/nomed/rustdesk-web-stack:${version}"
          docker tag "ghcr.io/nomed/rustdesk-web-stack:${version}" "ghcr.io/nomed/rustdesk-web-stack:v${version}"
          docker tag "ghcr.io/nomed/rustdesk-web-stack:${version}" ghcr.io/nomed/rustdesk-web-stack:latest
          docker push "ghcr.io/nomed/rustdesk-web-stack:v${version}"
          docker push ghcr.io/nomed/rustdesk-web-stack:latest

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1

      - name: Validate Helm chart
        shell: bash
        run: |
          set -euo pipefail
          helm lint charts/rustdesk-web
          helm template rustdesk-web charts/rustdesk-web >/dev/null

      - name: Package Helm chart
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.release-please.outputs.version }}'
          test "$(awk '/^version:/ {print $2}' charts/rustdesk-web/Chart.yaml)" = "${version}"
          test "$(awk -F'"' '/^appVersion:/ {print $2}' charts/rustdesk-web/Chart.yaml)" = "${version}"
          mkdir -p dist/chart
          helm package charts/rustdesk-web --destination dist/chart

      - name: Log in to GHCR for Helm
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Publish Helm chart as OCI
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.release-please.outputs.version }}'
          helm push "dist/chart/rustdesk-web-${version}.tgz" oci://ghcr.io/nomed/charts
