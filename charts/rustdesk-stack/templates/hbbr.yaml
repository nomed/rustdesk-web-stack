{{- if .Values.hbbr.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rustdesk-stack.fullname" . }}-hbbr
  labels:
    {{- include "rustdesk-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: hbbr
spec:
  replicas: {{ .Values.hbbr.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rustdesk-stack.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: hbbr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rustdesk-stack.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: hbbr
    spec:
      containers:
        - name: hbbr
          image: "{{ .Values.rustdeskServer.image.repository }}:{{ .Values.rustdeskServer.image.tag }}"
          imagePullPolicy: {{ .Values.rustdeskServer.image.pullPolicy }}
          command: ["hbbr"]
          {{- with .Values.hbbr.extraArgs }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.rustdeskServer.keys.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.rustdeskServer.keys.existingSecret }}
          {{- end }}
          ports:
            - name: relay
              containerPort: 21117
              protocol: TCP
            - name: websocket
              containerPort: 21119
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rustdesk-stack.fullname" . }}-hbbr
  labels:
    {{- include "rustdesk-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: hbbr
  {{- with .Values.hbbr.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.hbbr.service.type }}
  ports:
    - name: relay
      port: {{ .Values.hbbr.service.ports.relay }}
      targetPort: relay
      protocol: TCP
    - name: websocket
      port: {{ .Values.hbbr.service.ports.websocket }}
      targetPort: websocket
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "rustdesk-stack.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: hbbr
{{- end }}
