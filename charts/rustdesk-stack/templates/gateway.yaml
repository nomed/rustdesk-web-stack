{{- if .Values.gateway.enabled }}
{{- if .Values.gateway.createGateway }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.gatewayName }}
  {{- if .Values.gateway.gatewayNamespace }}
  namespace: {{ .Values.gateway.gatewayNamespace }}
  {{- end }}
spec:
  gatewayClassName: {{ required "gateway.gatewayClassName is required when gateway.createGateway=true" .Values.gateway.gatewayClassName }}
  listeners:
    - name: {{ .Values.gateway.sectionName }}
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.gateway.hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ required "gateway.tlsSecretName is required when gateway.createGateway=true" .Values.gateway.tlsSecretName }}
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "rustdesk-stack.fullname" . }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.gatewayName }}
      {{- if .Values.gateway.gatewayNamespace }}
      namespace: {{ .Values.gateway.gatewayNamespace }}
      {{- end }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ws/id
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: {{ include "rustdesk-stack.fullname" . }}-hbbs
          port: {{ .Values.hbbs.service.ports.websocket }}
    - matches:
        - path:
            type: PathPrefix
            value: /ws/relay
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: {{ include "rustdesk-stack.fullname" . }}-hbbr
          port: {{ .Values.hbbr.service.ports.websocket }}
    - backendRefs:
        - name: {{ include "rustdesk-stack.fullname" . }}-web
          port: {{ .Values.web.service.port }}
{{- end }}
