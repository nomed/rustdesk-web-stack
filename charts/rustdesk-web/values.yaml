replicaCount: 1

image:
  repository: ghcr.io/nomed/rustdesk-web-stack
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: rustdesk-web.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
